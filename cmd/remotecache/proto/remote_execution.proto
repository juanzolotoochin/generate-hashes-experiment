// The subset of the Remote Execution API v2 (bazelbuild/remote-apis) that a
// cache needs: ActionCache, ContentAddressableStorage and Capabilities. Field
// numbers match the upstream proto. Nested messages the cache only stores and
// returns (ActionResult's outputs and metadata) are declared as bytes, which is
// wire-compatible, so they round-trip without being modeled.
syntax = "proto3";

package build.bazel.remote.execution.v2;

service ActionCache {
  rpc GetActionResult(GetActionResultRequest) returns (ActionResult);
  rpc UpdateActionResult(UpdateActionResultRequest) returns (ActionResult);
}

service ContentAddressableStorage {
  rpc FindMissingBlobs(FindMissingBlobsRequest) returns (FindMissingBlobsResponse);
  rpc BatchUpdateBlobs(BatchUpdateBlobsRequest) returns (BatchUpdateBlobsResponse);
  rpc BatchReadBlobs(BatchReadBlobsRequest) returns (BatchReadBlobsResponse);
  rpc GetTree(GetTreeRequest) returns (stream GetTreeResponse);
}

service Capabilities {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (ServerCapabilities);
}

message Digest {
  string hash = 1;
  int64 size_bytes = 2;
}

message ActionResult {
  repeated bytes output_files = 2;          // OutputFile
  repeated bytes output_file_symlinks = 10; // OutputSymlink
  repeated bytes output_symlinks = 12;      // OutputSymlink
  repeated bytes output_directories = 3;    // OutputDirectory
  repeated bytes output_directory_symlinks = 11; // OutputSymlink
  int32 exit_code = 4;
  bytes stdout_raw = 5;
  Digest stdout_digest = 6;
  bytes stderr_raw = 7;
  Digest stderr_digest = 8;
  bytes execution_metadata = 9; // ExecutedActionMetadata
}

message GetActionResultRequest {
  string instance_name = 1;
  Digest action_digest = 2;
  bool inline_stdout = 3;
  bool inline_stderr = 4;
  repeated string inline_output_files = 5;
  int32 digest_function = 6;
}

message UpdateActionResultRequest {
  string instance_name = 1;
  Digest action_digest = 2;
  ActionResult action_result = 3;
  bytes results_cache_policy = 4; // ResultsCachePolicy
  int32 digest_function = 5;
}

message FindMissingBlobsRequest {
  string instance_name = 1;
  repeated Digest blob_digests = 2;
  int32 digest_function = 3;
}

message FindMissingBlobsResponse {
  repeated Digest missing_blob_digests = 2;
}

message BatchUpdateBlobsRequest {
  message Request {
    Digest digest = 1;
    bytes data = 2;
    int32 compressor = 3;
  }
  string instance_name = 1;
  repeated Request requests = 2;
  int32 digest_function = 5;
}

message BatchUpdateBlobsResponse {
  message Response {
    Digest digest = 1;
    Status status = 2;
  }
  repeated Response responses = 1;
}

message BatchReadBlobsRequest {
  string instance_name = 1;
  repeated Digest digests = 2;
  repeated int32 acceptable_compressors = 3;
  int32 digest_function = 4;
}

message BatchReadBlobsResponse {
  message Response {
    Digest digest = 1;
    bytes data = 2;
    int32 compressor = 4;
    Status status = 3;
  }
  repeated Response responses = 1;
}

message GetTreeRequest {
  string instance_name = 1;
  Digest root_digest = 2;
  int32 page_size = 3;
  string page_token = 4;
  int32 digest_function = 5;
}

message GetTreeResponse {
  repeated bytes directories = 1; // Directory
  string next_page_token = 2;
}

message GetCapabilitiesRequest {
  string instance_name = 1;
}

message ServerCapabilities {
  CacheCapabilities cache_capabilities = 1;
  SemVer low_api_version = 4;
  SemVer high_api_version = 5;
}

message CacheCapabilities {
  repeated int32 digest_functions = 1; // DigestFunction.Value
  ActionCacheUpdateCapabilities action_cache_update_capabilities = 2;
  int64 max_batch_total_size_bytes = 4;
  int32 symlink_absolute_path_strategy = 5; // SymlinkAbsolutePathStrategy.Value
}

message ActionCacheUpdateCapabilities {
  bool update_enabled = 1;
}

// build.bazel.semver.SemVer
message SemVer {
  int32 major = 1;
  int32 minor = 2;
  int32 patch = 3;
  string prerelease = 4;
}

// google.rpc.Status
message Status {
  int32 code = 1;
  string message = 2;
  repeated bytes details = 3; // google.protobuf.Any
}
