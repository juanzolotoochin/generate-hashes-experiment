[package]
name = "remotecache"
version = "0.1.0"
edition = "2021"
publish = false
description = "A minimal Bazel remote cache (REAPI v2 CAS, ActionCache, ByteStream) on local disk, for hashbench."
license = "Apache-2.0"

[dependencies]
prost = "0.13"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"

[build-dependencies]
protox = "0.7"
tonic-build = "0.12"
